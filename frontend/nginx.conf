server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        # React Router's client-side routes (e.g. /targets/:id) have no
        # matching file on disk — without this fallback, refreshing the
        # browser on one of them 404s at Nginx before React ever loads.
        try_files $uri $uri/ /index.html;
    }
}
